name: Release desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar (ej. 1.0.1). Debe coincidir con package.json / tauri.conf.json'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          tagName: v${{ inputs.version }}
          releaseName: BMatrix Calendario v${{ inputs.version }}
          releaseBody: |
            Instaladores de BMatrix Calendario ${{ inputs.version }}.

            La app instalada puede actualizarse sola desde esta release (`latest.json`).
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
