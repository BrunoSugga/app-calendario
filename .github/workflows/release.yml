name: Release desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar (ej. 1.0.1). Debe coincidir con package.json / tauri.conf.json'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-desktop
  cancel-in-progress: false

jobs:
  release-windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Validate version
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          npm run check:versions
          if ($env:EXPECTED_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version input must use numeric semver (for example 1.2.1)"
          }
          $packageVersion = node -p "require('./package.json').version"
          if ($packageVersion -ne $env:EXPECTED_VERSION) {
            throw "Input version does not match package.json"
          }

      - name: Quality gate
        run: |
          npm audit --omit=dev --audit-level=high
          npm run lint
          npm test
          npm run build

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_PUBLIC_APP_URL: https://calendario.bmatrix.org
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          tagName: v${{ inputs.version }}
          releaseName: BMatrix Calendario v${{ inputs.version }}
          releaseBody: |
            Instaladores de BMatrix Calendario ${{ inputs.version }}.

            La app instalada puede actualizarse sola desde esta release (`latest.json`).
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
